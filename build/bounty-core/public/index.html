<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0E0F13" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F8F8F6" media="(prefers-color-scheme: light)">
    <meta name="description" content="Bounty — a marketplace for real work. Businesses post tasks, workers prove their ability by doing them.">

    <!-- Pre-paint theme application, so there is no flash of wrong scheme on reload.

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="system/tokens.css">
    <link rel="stylesheet" href="system/reset.css">
    <link rel="stylesheet" href="system/base.css">
    <link rel="stylesheet" href="system/components.css">
    <link rel="stylesheet" href="system/layout.css">
    <link rel="stylesheet" href="bounty.css">
    <link rel="stylesheet" href="features/features.css">
</head>

<body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header id="hdr"></header>
    <main id="app" tabindex="-1" aria-live="polite"></main>
    <footer id="footer" class="site-footer"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="modal-root"></div>
    <script src="features/core.js"></script>

</html>
